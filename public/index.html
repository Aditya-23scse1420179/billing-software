<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BILLING SOFTWARE</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <div id="header">BILLING SOFTWARE</div>

  <!-- Customer Details -->
  <div class="section">
    <div class="section-title">Customer Details</div>
    <div id="customer-section">
      <label for="c-name">Customer Name</label>
      <input type="text" id="c-name" placeholder="Enter name" />

      <label for="c-phone">Phone Number</label>
      <input type="tel" id="c-phone" placeholder="Enter phone" />

      <label for="c-bill-no">Bill Number</label>
      <input type="text" id="c-bill-no" readonly />

      <label for="search-bill">Search Bill No.</label>
      <input type="text" id="search-bill" placeholder="Bill number" />
      <button onclick="findBill()">Search</button>
    </div>
  </div>

  <!-- Main Grid: 3 product panels + bill area -->
  <div id="main-grid">

    <!-- Cosmetics -->
    <div class="product-panel">
      <div class="section-title">Cosmetics</div>
      <div class="product-row"><label>Bath Soap</label><input type="number" id="soap" min="0" value="0" /></div>
      <div class="product-row"><label>Face Cream</label><input type="number" id="face_cream" min="0" value="0" /></div>
      <div class="product-row"><label>Face Wash</label><input type="number" id="face_wash" min="0" value="0" /></div>
      <div class="product-row"><label>Hair Spray</label><input type="number" id="spray" min="0" value="0" /></div>
      <div class="product-row"><label>Hair Gel</label><input type="number" id="gel" min="0" value="0" /></div>
      <div class="product-row"><label>Body Lotion</label><input type="number" id="lotion" min="0" value="0" /></div>
    </div>

    <!-- Grocery -->
    <div class="product-panel">
      <div class="section-title">Grocery</div>
      <div class="product-row"><label>Rice</label><input type="number" id="rice" min="0" value="0" /></div>
      <div class="product-row"><label>Food Oil</label><input type="number" id="food_oil" min="0" value="0" /></div>
      <div class="product-row"><label>Daal</label><input type="number" id="daal" min="0" value="0" /></div>
      <div class="product-row"><label>Wheat</label><input type="number" id="wheat" min="0" value="0" /></div>
      <div class="product-row"><label>Sugar</label><input type="number" id="sugar" min="0" value="0" /></div>
      <div class="product-row"><label>Tea</label><input type="number" id="tea" min="0" value="0" /></div>
    </div>

    <!-- Cold Drinks -->
    <div class="product-panel">
      <div class="section-title">Cold Drinks</div>
      <div class="product-row"><label>Maza</label><input type="number" id="maza" min="0" value="0" /></div>
      <div class="product-row"><label>Coke</label><input type="number" id="coke" min="0" value="0" /></div>
      <div class="product-row"><label>Thumbs Up</label><input type="number" id="thumsup" min="0" value="0" /></div>
      <div class="product-row"><label>Limca</label><input type="number" id="limca" min="0" value="0" /></div>
      <div class="product-row"><label>Pepsi</label><input type="number" id="pepsi" min="0" value="0" /></div>
      <div class="product-row"><label>Sprite</label><input type="number" id="sprite" min="0" value="0" /></div>
    </div>

    <!-- Bill Area -->
    <div class="product-panel" id="bill-panel">
      <div id="bill-title">Bill Area</div>
      <textarea id="bill-area" readonly></textarea>
    </div>

  </div>

  <!-- Bill Menu -->
  <div class="section" id="bill-menu">
    <div class="section-title">Bill Menu</div>
    <div id="bill-menu-inner">
      <div class="totals-group">
        <label>Total Cosmetic Price</label>
        <input type="text" id="cosmetic-price" readonly />
        <label>Cosmetic Tax (5%)</label>
        <input type="text" id="cosmetic-tax" readonly />

        <label>Total Grocery Price</label>
        <input type="text" id="grocery-price" readonly />
        <label>Grocery Tax (10%)</label>
        <input type="text" id="grocery-tax" readonly />

        <label>Total Cold-Drinks Price</label>
        <input type="text" id="drink-price" readonly />
        <label>Cold-Drinks Tax (5%)</label>
        <input type="text" id="drink-tax" readonly />
      </div>

      <div id="btn-group">
        <button onclick="calcTotal()">Total</button>
        <button onclick="generateBill()">Generate Bill</button>
        <button onclick="confirmClear()">Clear Bill</button>
        <button onclick="printBill()">Print Bill</button>
        <button onclick="showAllBills()">All Bills</button>
      </div>
    </div>
  </div>

  <!-- Confirm Modal -->
  <div class="modal-overlay" id="confirm-modal">
    <div class="modal-box">
      <h3 id="confirm-title">Confirm</h3>
      <p id="confirm-msg"></p>
      <div class="modal-actions">
        <button id="confirm-yes">Yes</button>
        <button class="cancel" onclick="closeModal('confirm-modal')">No</button>
      </div>
    </div>
  </div>

  <!-- Alert Modal -->
  <div class="modal-overlay" id="alert-modal">
    <div class="modal-box">
      <h3 id="alert-title">Info</h3>
      <p id="alert-msg"></p>
      <div class="modal-actions">
        <button onclick="closeModal('alert-modal')">OK</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
